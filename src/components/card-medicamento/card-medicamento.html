<div class="flex items-center justify-between rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
  <div class="flex-1">
    <span class="text-xs font-semibold uppercase tracking-wide text-cyan-700">
      Forma farmaceutica
    </span>

    <h3 class="mt-1 text-xl font-bold text-gray-900">
      {{ medicamento()?.nome}}
    </h3>

    <p class="mt-2 text-sm text-gray-500">
        {{ medicamento()?.formaFarmaceutica}}
    </p>

    <hr class="my-3 border-gray-100" />

    <div class="flex items-center justify-between">
      <span class="text-sm text-gray-600">
        {{ medicamento()?.fabricante?.nomeFantasia }}
      </span>

      <span class="flex items-center gap-1.5 text-sm text-emerald-600">
        <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
        {{medicamento()?.disponivel === true ? 'Disponivel' : 'Indisponivel' }}
      </span>
    </div>
  </div>
  
  <svg class="ml-2 h-5 w-5 flex-shrink-0 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
  </svg>
</div>
