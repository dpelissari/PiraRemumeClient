<div class="container mx-auto px-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        @if (carregando()) {
            <p>Carregando...</p>
        } 
        @else if (erro()) {
        <p>{{ erro() }}</p>
        }
         @else {
            @for (med of medicamentos(); track med.id) {
            <app-card-medicamento [medicamento]="med" />
            }
        }
    </div>
</div>
