<div
  class="inline-flex rounded-lg border border-line bg-ink/5 p-0.5"
  role="radiogroup"
  aria-label="Aparência"
>
  <button
    type="button"
    class="rounded-md p-1.5 text-faint hover:text-ink"
    [class.bg-surface]="tema() === 'claro'"
    [class.text-ink]="tema() === 'claro'"
    [class.shadow-sm]="tema() === 'claro'"
    role="radio"
    title="Claro"
    aria-label="Claro"
    [attr.aria-checked]="tema() === 'claro'"
    (click)="definir('claro')"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M12 3.5v1.5m0 14v1.5M4.93 4.93l1.06 1.06m12.02 12.02 1.06 1.06M3.5 12H5m14 0h1.5M4.93 19.07l1.06-1.06m12.02-12.02 1.06-1.06M16.2 12a4.2 4.2 0 11-8.4 0 4.2 4.2 0 018.4 0z"
      />
    </svg>
  </button>
  <button
    type="button"
    class="rounded-md p-1.5 text-faint hover:text-ink"
    [class.bg-surface]="tema() === 'sistema'"
    [class.text-ink]="tema() === 'sistema'"
    [class.shadow-sm]="tema() === 'sistema'"
    role="radio"
    title="Sistema"
    aria-label="Sistema"
    [attr.aria-checked]="tema() === 'sistema'"
    (click)="definir('sistema')"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M8 17.5h8M6.5 4.5h11A1.5 1.5 0 0119 6v8.5a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 015 14.5V6A1.5 1.5 0 016.5 4.5z"
      />
    </svg>
  </button>
  <button
    type="button"
    class="rounded-md p-1.5 text-faint hover:text-ink"
    [class.bg-surface]="tema() === 'escuro'"
    [class.text-ink]="tema() === 'escuro'"
    [class.shadow-sm]="tema() === 'escuro'"
    role="radio"
    title="Escuro"
    aria-label="Escuro"
    [attr.aria-checked]="tema() === 'escuro'"
    (click)="definir('escuro')"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M16.5 13.2A6.7 6.7 0 1110.8 7.5 5.2 5.2 0 0016.5 13.2z"
      />
    </svg>
  </button>
</div>
