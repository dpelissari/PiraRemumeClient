<div class="grid grid-cols-2 gap-1 rounded-lg bg-ink/5 p-1">
  <button
    type="button"
    class="tab ff-noto rounded-md px-3 py-2 text-sm font-medium"
    [class.ativo]="buscaAtiva() === 'medicamento'"
    (click)="setTipoBusca('medicamento')"
  >
    Nome
  </button>

  <button
    type="button"
    class="tab ff-noto rounded-md px-3 py-2 text-sm font-medium"
    [class.ativo]="buscaAtiva() === 'grupo'"
    (click)="setTipoBusca('grupo')"
  >
    Grupo
  </button>
</div>
