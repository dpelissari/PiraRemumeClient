<div class="nav-menu ff-noto">
  <div class="container mx-auto flex items-center justify-between px-4 py-4">
    <a routerLink="/" class="wordmark">
      <img src="logo.png" width="28" height="28" alt="" />
      PiraREMUME
    </a>
    <div class="flex items-center gap-3">
      <app-seletor-tema />
      <button
        type="button"
        class="p-2 text-ink md:hidden"
        (click)="menuAberto.set(!menuAberto())"
        aria-label="Abrir menu"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <nav class="hidden items-center gap-7 text-[13px] md:flex">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Consulta</a>
        <a routerLink="/farmacias" routerLinkActive="active">Farmácias</a>
        <a routerLink="/sobre" routerLinkActive="active">Sobre</a>
      </nav>
    </div>
  </div>
  @if (menuAberto()) {
    <nav class="flex flex-col gap-3 px-4 pb-4 text-sm md:hidden">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="menuAberto.set(false)">Consulta</a>
      <a routerLink="/farmacias" routerLinkActive="active" (click)="menuAberto.set(false)">Farmácias</a>
      <a routerLink="/sobre" routerLinkActive="active" (click)="menuAberto.set(false)">Sobre</a>
    </nav>
  }
</div>
