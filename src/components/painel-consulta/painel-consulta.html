<section class="relative overflow-hidden border-b border-[var(--cor-secundaria)]/40 bg-gradient-to-b from-[#e8f2f4] to-white py-10 md:py-14">
  <div class="pointer-events-none absolute -right-24 -top-24 h-64 w-64 rounded-full bg-[var(--cor-secundaria)]/30 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-20 left-10 h-48 w-48 rounded-full bg-[var(--cor-primaria)]/10 blur-3xl"></div>

  <div class="container relative mx-auto px-4">
    <div class="flex w-full flex-col gap-5 md:w-3/5 lg:w-1/2">
      <div class="flex flex-col gap-2">
        <h1 class="ff-noto text-3xl font-semibold tracking-tight text-[var(--cor-primaria)] md:text-4xl">
          Consulta de Medicamentos
        </h1>
        <p class="ff-noto max-w-xl text-base leading-relaxed text-slate-600">
          Consulte gratuitamente se o remédio prescrito pelo seu médico está
          disponível no SUS e economize na hora de comprar seus medicamentos.
        </p>
      </div>

      <app-tipo-consulta
        (mudouPlaceholder)="atualizarPlaceHolder($event)"
        (tipoSelecionado)="atualizarTipo($event)"
      />

      <form class="flex flex-col gap-3 sm:flex-row sm:items-stretch" (submit)="aoSubmeter($event)">
        <label class="relative block min-w-0 flex-1">
          <span class="sr-only">Buscar medicamento</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="pointer-events-none absolute top-1/2 left-3 size-5 -translate-y-1/2 text-slate-400"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
              clip-rule="evenodd"
            />
          </svg>
          <input
            class="ff-noto w-full rounded-lg border-2 border-slate-200 bg-white py-3 pr-4 pl-11 text-slate-800 shadow-sm transition placeholder:text-slate-400 focus:border-[var(--cor-secundaria)] focus:outline-none focus:ring-2 focus:ring-[var(--cor-secundaria)]/40"
            (input)="aoDigitar($event)"
            type="text"
            name="termo"
            [placeholder]="placeHolder()"
          />
        </label>

        <button
          type="submit"
          class="ff-noto rounded-lg bg-[var(--cor-primaria)] px-6 py-3 font-medium text-white shadow-sm transition hover:brightness-110 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--cor-primaria)]/40 active:scale-[0.98] sm:shrink-0"
        >
          Buscar
        </button>
      </form>
    </div>
  </div>
</section>
