<section class="search-panel">

    <div class="container mx-auto px-4">
        <div class="flex flex-col gap-2 w-full md:w-1/2">

            <h1 class="text-3xl ff-noto font-semibold">Consulta de Medicamentos</h1>
            <p class="ff-noto">
                Consulte gratuitamente se o remédio prescrito pelo seu médico está
                 disponível no SUS e economize na hora de comprar seus medicamentos.</p>
            <div class="type-search-button">
                <div class="nome-medicamento"></div>
                <div class="principo-ativo"></div>
                <div class="categoria-terapeutica"></div>
            </div>

            <app-tipo-consulta (mudouPlaceholder)="atualizarPlaceHolder($event)" />

            <div class="flex gap-2">
                <div class="search">
                    <input class="input-search" (input)="aoDigitar($event)" type="text" [placeholder]="placeHolder()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                        <path fill-rule="evenodd"
                            d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <button class="search-button ff-noto" (click)="buscar()">Buscar</button>
            </div>

        </div>
    </div>
</section>
