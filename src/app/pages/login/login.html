<section class="hero py-16 md:py-24">
  <div class="container mx-auto max-w-md px-4">
    <h1 class="ff-noto text-[2.15rem] font-semibold leading-[1.1] tracking-[-0.03em] text-[var(--ink)]">
      Área administrativa
    </h1>
    <p class="ff-noto mt-3 text-[15px] leading-relaxed text-[var(--muted)]">
      Para entrar, use seu usuário e senha.
    </p>

    <form class="mt-8 flex flex-col gap-4" (submit)="$event.preventDefault(); entrar()">
      <label class="block">
        <span class="ff-noto mb-1.5 block text-sm text-muted">Usuário</span>
        <input
          class="ff-noto w-full rounded-lg border border-line bg-surface px-5 py-3 text-ink placeholder:text-faint focus:border-[var(--cor-primaria)] focus:outline-none"
          name="usuario"
          autocomplete="username"
          [(ngModel)]="nomeUsuario"
        />
      </label>
      <label class="block">
        <span class="ff-noto mb-1.5 block text-sm text-muted">Senha</span>
        <span class="relative block">
          <input
            class="ff-noto w-full rounded-lg border border-line bg-surface py-3 pl-5 pr-12 text-ink placeholder:text-faint focus:border-[var(--cor-primaria)] focus:outline-none"
            [type]="senhaVisivel() ? 'text' : 'password'"
            name="senha"
            autocomplete="current-password"
            [(ngModel)]="senha"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-[var(--muted)] hover:text-[var(--ink)]"
            (click)="senhaVisivel.set(!senhaVisivel())"
            [attr.aria-label]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-pressed]="senhaVisivel()"
          >
            @if (senhaVisivel()) {
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            } @else {
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            }
          </button>
        </span>
      </label>

      @if (erro()) {
        <p class="ff-noto text-sm text-red-700 dark:text-red-400">{{ erro() }}</p>
      }

      <button
        type="submit"
        class="ff-noto rounded-lg bg-btn px-6 py-3 text-sm font-medium text-btn-fg hover:opacity-90 disabled:opacity-40"
        [disabled]="enviando() || !nomeUsuario.trim() || !senha"
      >
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="ff-noto mt-6 text-sm text-faint">
      <a routerLink="/" class="text-[var(--cor-primaria)] hover:underline">Voltar para a página inicial</a>
    </p>
  </div>
</section>
